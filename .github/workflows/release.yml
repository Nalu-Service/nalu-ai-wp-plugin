# Pushing a vX.Y.Z tag publishes a GitHub release with nalu-ai.zip attached.
# Sites running the plugin pick it up from the latest release (includes/updater.php).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build nalu-ai.zip
        run: bin/build-zip.sh "$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nalu-ai.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
